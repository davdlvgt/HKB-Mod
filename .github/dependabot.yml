version: 2
updates:
  # Disable Gradle updates since MinecraftForge requires specific versions
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "never"

  # Only allow GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10