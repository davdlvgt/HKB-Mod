name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.ref_name == 'master' || github.event_name == 'workflow_dispatch'

    env:
      GRADLE_OPTS: -Xmx4g -Xms1g
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      DISABLE_GRADLE_CACHING: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix Gradle wrapper permissions and version immediately
      run: |
        chmod +x gradlew
        echo "Forcing Gradle 8.12.1 for Forge compatibility..."
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.12.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
        echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-8.12.1-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify and force Gradle wrapper version
      run: |
        echo "Gradle wrapper version:"
        grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
        echo "Forcing Gradle wrapper to download correct version..."
        ./gradlew wrapper --gradle-version=8.12.1
        echo "Verifying Gradle version:"
        ./gradlew --version

    - name: Get version from tag or input
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Update version in gradle.properties
      run: |
        sed -i "s/mod_version=.*/mod_version=${{ steps.version.outputs.version }}/" gradle.properties

    - name: Build release JAR
      run: ./gradlew build --no-daemon

    - name: Generate data
      run: ./gradlew runData --no-daemon

    - name: Get mod file name
      id: modfile
      run: |
        MOD_FILE=$(ls build/libs/*.jar | head -n 1)
        echo "path=$MOD_FILE" >> $GITHUB_OUTPUT
        echo "name=$(basename $MOD_FILE)" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          CHANGES=$(git log --pretty=format:"- %s" --no-merges)
        else
          CHANGES=$(git log --pretty=format:"- %s" --no-merges $LAST_TAG..HEAD)
        fi

        # Create changelog
        cat > CHANGELOG.md << EOF
        ## Changes in v${{ steps.version.outputs.version }}

        $CHANGES

        ## Installation
        1. Download the JAR file from the assets below
        2. Place it in your Minecraft mods folder
        3. Requires Minecraft 1.21.7 and Forge 57.0.2+

        ## Compatibility
        - Minecraft: 1.21.7
        - Forge: 57.0.2+
        - Java: 21+
        EOF

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: HKB Mod v${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: ${{ steps.modfile.outputs.path }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to CurseForge (optional)
      # Uncomment and configure if you want to upload to CurseForge
      # uses: itsmeow/curseforge-upload@v3
      # with:
      #   token: ${{ secrets.CF_API_TOKEN }}
      #   project_id: YOUR_PROJECT_ID
      #   game_endpoint: minecraft
      #   file_path: ${{ steps.modfile.outputs.path }}
      #   changelog: ${{ steps.changelog.outputs.changelog }}
      #   changelog_type: markdown
      #   game_versions: "1.21.7,Forge"
      #   release_type: release
      run: echo "CurseForge upload disabled - configure if needed"

    - name: Upload to Modrinth (optional)
      # Uncomment and configure if you want to upload to Modrinth
      # uses: RubixDev/modrinth-upload@v1
      # with:
      #   token: ${{ secrets.MODRINTH_TOKEN }}
      #   file_path: ${{ steps.modfile.outputs.path }}
      #   name: HKB Mod v${{ steps.version.outputs.version }}
      #   version: ${{ steps.version.outputs.version }}
      #   changelog: ${{ steps.changelog.outputs.changelog }}
      #   game_versions: |
      #     1.21.7
      #   loaders: |
      #     forge
      run: echo "Modrinth upload disabled - configure if needed"