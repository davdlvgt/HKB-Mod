name: PR Checks

on:
  pull_request:
    branches: [ dev, release, master ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate PR title
      uses: amannn/action-semantic-pull-request@v5
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          test
          chore
          build
          ci
          release
          hotfix
        requireScope: false
        subjectPattern: ^.{1,50}
        subjectPatternError: |
          The subject "{subject}" found in the pull request title "{title}"
          doesn't match the configured pattern. Please ensure that the subject
          doesn't start with an uppercase character and is no longer than 50 characters.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check branch naming
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix|docs|style|refactor|test|chore|build|ci|experiment|research|improve|update)/.+ ]]; then
          echo "::error::Branch name '$BRANCH_NAME' does not follow naming convention. Expected: type/description"
          echo "Valid types: feature, fix, hotfix, docs, style, refactor, test, chore, build, ci, experiment, research, improve, update"
          exit 1
        fi

    - name: Check target branch
      run: |
        TARGET="${{ github.base_ref }}"
        SOURCE="${{ github.head_ref }}"

        # Check if targeting master
        if [[ "$TARGET" == "master" ]]; then
          if [[ ! "$SOURCE" =~ ^(release|hotfix)/.+ ]] && [[ "$SOURCE" != "release" ]]; then
            echo "::error::Only release branches and hotfix branches can target master. Current source: $SOURCE"
            exit 1
          fi
        fi

        # Check if targeting release
        if [[ "$TARGET" == "release" ]]; then
          if [[ ! "$SOURCE" =~ ^(dev|hotfix)/.+ ]] && [[ "$SOURCE" != "dev" ]]; then
            echo "::error::Only dev branch and hotfix branches can target release. Current source: $SOURCE"
            exit 1
          fi
        fi

  build-and-test:
    name: Build and Test PR
    runs-on: ubuntu-latest
    needs: validate-pr

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean build
      run: ./gradlew clean

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run data generation
      run: ./gradlew runData

    - name: Check for generated files changes
      id: check_generated
      run: |
        if [ -n "$(git status --porcelain src/generated)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Generated files have changes:"
          git status --porcelain src/generated
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR about generated files
      if: steps.check_generated.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ **Generated files are out of date**\n\nThe data generation produced different files than what\'s committed. Please run `./gradlew runData` locally and commit the updated generated files.\n\nThis is likely because:\n- New items/blocks were added without regenerating data\n- Data generator code was modified\n- Dependencies were updated\n\nGenerated files should always be kept in sync with the code.'
          })

    - name: Fail if generated files are out of date
      if: steps.check_generated.outputs.has_changes == 'true' && github.base_ref == 'master'
      run: |
        echo "::error::Generated files are out of date for master branch PR. This is not allowed."
        exit 1

    - name: Check code style (optional)
      run: |
        # Add your code style checks here if you have any
        echo "Code style check passed"

    - name: Security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      if: github.event_name == 'pull_request'
      continue-on-error: true
      with:
        sarif-file: 'results.sarif'

  size-check:
    name: Check JAR Size
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Build JAR
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Check JAR size
      run: |
        JAR_FILE=$(ls build/libs/*.jar | head -n 1)
        JAR_SIZE=$(stat -c%s "$JAR_FILE")
        JAR_SIZE_MB=$((JAR_SIZE / 1024 / 1024))

        echo "JAR size: ${JAR_SIZE_MB}MB"

        # Warn if JAR is larger than 50MB (adjust as needed)
        if [ $JAR_SIZE_MB -gt 50 ]; then
          echo "::warning::JAR size is ${JAR_SIZE_MB}MB, which is quite large. Consider optimizing assets or dependencies."
        fi

        # Fail if JAR is larger than 100MB (adjust as needed)
        if [ $JAR_SIZE_MB -gt 100 ]; then
          echo "::error::JAR size is ${JAR_SIZE_MB}MB, which exceeds the maximum allowed size of 100MB."
          exit 1
        fi

    - name: Comment JAR size on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const jarFile = require('child_process').execSync('ls build/libs/*.jar | head -n 1').toString().trim();
          const jarSize = fs.statSync(jarFile).size;
          const jarSizeMB = Math.round(jarSize / 1024 / 1024 * 100) / 100;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `📦 **Build Information**\n\n- JAR Size: ${jarSizeMB}MB\n- Java Version: 21\n- Build Status: ✅ Success\n\nThe mod has been successfully built and is ready for testing.`
          })