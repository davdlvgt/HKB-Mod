name: PR Checks

on:
  pull_request:
    branches: [ dev, release, master ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate PR title
      uses: amannn/action-semantic-pull-request@v5
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          test
          chore
          build
          ci
          release
          hotfix
        requireScope: false
        subjectPattern: ^.{1,50}
        subjectPatternError: |
          The subject "{subject}" found in the pull request title "{title}"
          doesn't match the configured pattern. Please ensure that the subject
          doesn't start with an uppercase character and is no longer than 50 characters.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check branch naming
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix|docs|style|refactor|test|chore|build|ci|experiment|research|improve|update)/.+ ]]; then
          echo "::error::Branch name '$BRANCH_NAME' does not follow naming convention. Expected: type/description"
          echo "Valid types: feature, fix, hotfix, docs, style, refactor, test, chore, build, ci, experiment, research, improve, update"
          exit 1
        fi

    - name: Check target branch
      run: |
        TARGET="${{ github.base_ref }}"
        SOURCE="${{ github.head_ref }}"

        # Check if targeting master
        if [[ "$TARGET" == "master" ]]; then
          if [[ ! "$SOURCE" =~ ^(release|hotfix)/.+ ]] && [[ "$SOURCE" != "release" ]]; then
            echo "::error::Only release branches and hotfix branches can target master. Current source: $SOURCE"
            exit 1
          fi
        fi

        # Check if targeting release
        if [[ "$TARGET" == "release" ]]; then
          if [[ ! "$SOURCE" =~ ^(dev|hotfix)/.+ ]] && [[ "$SOURCE" != "dev" ]]; then
            echo "::error::Only dev branch and hotfix branches can target release. Current source: $SOURCE"
            exit 1
          fi
        fi

  build-and-test:
    name: Build and Test PR
    runs-on: ubuntu-latest
    needs: validate-pr

    env:
      GRADLE_OPTS: -Xmx4g -Xms1g
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      DISABLE_GRADLE_CACHING: true
      GRADLE_VERSION: "8.12.1"
      GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.12.1-bin.zip"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Bypass GitHub Gradle detection and setup wrapper
      run: |
        # Hide Gradle files from GitHub's automatic detection
        mv gradlew gradlew.backup || true
        mv gradlew.bat gradlew.bat.backup || true
        mv gradle gradle.backup || true

        # Remove any system Gradle installations
        sudo rm -rf /opt/gradle* || true
        sudo rm -rf /usr/share/gradle* || true
        which gradle && sudo rm -f $(which gradle) || true

        # Clear PATH of any gradle references
        export PATH=$(echo $PATH | tr ':' '\n' | grep -v gradle | tr '\n' ':')

        # Recreate gradle directory and wrapper with exact version
        mkdir -p gradle/wrapper

        # Create wrapper properties with exact version
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.12.1-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # Restore and fix wrapper scripts
        mv gradlew.backup gradlew || true
        mv gradlew.bat.backup gradlew.bat || true
        chmod +x gradlew

        # Download Gradle 8.12.1 directly to ensure we have it
        wget -q https://services.gradle.org/distributions/gradle-8.12.1-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH

        echo "=== Verification ==="
        echo "Gradle version:"
        /tmp/gradle-8.12.1/bin/gradle --version
        echo "Wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Disabled caching to prevent Gradle version conflicts
    # - name: Cache Gradle packages
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       ~/.gradle/caches
    #       ~/.gradle/wrapper
    #     key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
    #     restore-keys: |
    #       ${{ runner.os }}-gradle-8.12.1-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify and force Gradle wrapper version
      run: |
        echo "Gradle wrapper version:"
        grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
        echo "Forcing Gradle wrapper to download correct version..."
        ./gradlew wrapper --gradle-version=8.12.1
        echo "Verifying Gradle version:"
        ./gradlew --version

    - name: Clean build
      run: |
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH
        /tmp/gradle-8.12.1/bin/gradle clean --no-daemon

    - name: Build with Gradle
      run: |
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH
        /tmp/gradle-8.12.1/bin/gradle build --no-daemon

    - name: Run data generation
      run: |
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH
        /tmp/gradle-8.12.1/bin/gradle runData --no-daemon

    - name: Check for generated files changes
      id: check_generated
      run: |
        if [ -n "$(git status --porcelain src/generated)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Generated files have changes:"
          git status --porcelain src/generated
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Log generated files status
      if: steps.check_generated.outputs.has_changes == 'true'
      run: |
        echo "⚠️ Generated files are out of date"
        echo "The data generation produced different files than what's committed."
        echo "Please run './gradlew runData' locally and commit the updated generated files."

    - name: Fail if generated files are out of date
      if: steps.check_generated.outputs.has_changes == 'true' && github.base_ref == 'master'
      run: |
        echo "::error::Generated files are out of date for master branch PR. This is not allowed."
        exit 1

    - name: Check code style (optional)
      run: |
        # Add your code style checks here if you have any
        echo "Code style check passed"

    - name: Basic security check
      run: |
        # Basic security checks
        echo "Running basic security checks..."

        # Check for common security issues in Java files
        if find src -name "*.java" -exec grep -l "System.out.print" {} \; | head -5; then
          echo "⚠️ Warning: Found System.out.print statements (consider using logger)"
        fi

        # Check for hardcoded secrets patterns
        if find src -name "*.java" -exec grep -l "password\|secret\|key.*=" {} \; | head -5; then
          echo "⚠️ Warning: Potential hardcoded secrets found"
        fi

        echo "Basic security check completed"

  size-check:
    name: Check JAR Size
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      GRADLE_OPTS: -Xmx4g -Xms1g
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      DISABLE_GRADLE_CACHING: true
      GRADLE_VERSION: "8.12.1"
      GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.12.1-bin.zip"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Bypass GitHub Gradle detection and setup wrapper
      run: |
        # Hide Gradle files from GitHub's automatic detection
        mv gradlew gradlew.backup || true
        mv gradlew.bat gradlew.bat.backup || true
        mv gradle gradle.backup || true

        # Remove any system Gradle installations
        sudo rm -rf /opt/gradle* || true
        sudo rm -rf /usr/share/gradle* || true
        which gradle && sudo rm -f $(which gradle) || true

        # Clear PATH of any gradle references
        export PATH=$(echo $PATH | tr ':' '\n' | grep -v gradle | tr '\n' ':')

        # Recreate gradle directory and wrapper with exact version
        mkdir -p gradle/wrapper

        # Create wrapper properties with exact version
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.12.1-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # Restore and fix wrapper scripts
        mv gradlew.backup gradlew || true
        mv gradlew.bat.backup gradlew.bat || true
        chmod +x gradlew

        # Download Gradle 8.12.1 directly to ensure we have it
        wget -q https://services.gradle.org/distributions/gradle-8.12.1-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH

        echo "=== Verification ==="
        echo "Gradle version:"
        /tmp/gradle-8.12.1/bin/gradle --version
        echo "Wrapper properties:"
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Disabled caching to prevent Gradle version conflicts
    # - name: Cache Gradle packages
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       ~/.gradle/caches
    #       ~/.gradle/wrapper
    #     key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Build JAR
      run: |
        # Download Gradle 8.12.1 directly
        wget -q https://services.gradle.org/distributions/gradle-8.12.1-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        export GRADLE_HOME=/tmp/gradle-8.12.1
        export PATH=$GRADLE_HOME/bin:$PATH

        echo "Gradle version:"
        /tmp/gradle-8.12.1/bin/gradle --version
        echo "Building with Gradle 8.12.1..."
        /tmp/gradle-8.12.1/bin/gradle build --no-daemon

    - name: Check JAR size
      run: |
        JAR_FILE=$(ls build/libs/*.jar | head -n 1)
        JAR_SIZE=$(stat -c%s "$JAR_FILE")
        JAR_SIZE_MB=$((JAR_SIZE / 1024 / 1024))

        echo "JAR size: ${JAR_SIZE_MB}MB"

        # Warn if JAR is larger than 50MB (adjust as needed)
        if [ $JAR_SIZE_MB -gt 50 ]; then
          echo "::warning::JAR size is ${JAR_SIZE_MB}MB, which is quite large. Consider optimizing assets or dependencies."
        fi

        # Fail if JAR is larger than 100MB (adjust as needed)
        if [ $JAR_SIZE_MB -gt 100 ]; then
          echo "::error::JAR size is ${JAR_SIZE_MB}MB, which exceeds the maximum allowed size of 100MB."
          exit 1
        fi

    - name: Log JAR size information
      run: |
        JAR_FILE=$(ls build/libs/*.jar | head -n 1)
        JAR_SIZE=$(stat -c%s "$JAR_FILE")
        JAR_SIZE_MB=$((JAR_SIZE / 1024 / 1024))
        echo "📦 Build Information"
        echo "- JAR Size: ${JAR_SIZE_MB}MB"
        echo "- Java Version: 21"
        echo "- Build Status: ✅ Success"
        echo "The mod has been successfully built and is ready for testing."