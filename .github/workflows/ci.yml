name: CI - Build and Test

on:
  push:
    branches: [ dev, release ]
  pull_request:
    branches: [ dev, release, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    env:
      GRADLE_OPTS: -Xmx4g -Xms1g

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-8.12.1-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify and force Gradle wrapper version
      run: |
        echo "Gradle wrapper version:"
        grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
        echo "Forcing Gradle wrapper to download correct version..."
        ./gradlew wrapper --gradle-version=8.12.1
        echo "Verifying Gradle version:"
        ./gradlew --version

    - name: Clean build
      run: ./gradlew clean --no-daemon

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Run data generation
      run: ./gradlew runData --no-daemon

    - name: Check for uncommitted generated files
      run: |
        if [ -n "$(git status --porcelain src/generated)" ]; then
          echo "::error::Generated files are not up to date. Please run './gradlew runData' and commit the changes."
          git status --porcelain src/generated
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: HKB-Mod-${{ matrix.java }}-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 30

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ matrix.java }}-${{ github.sha }}
        path: |
          build/reports/
          logs/
        retention-days: 7