name: CI - Build and Test

on:
  push:
    branches: [ dev, release ]
  pull_request:
    branches: [ dev, release, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean build
      run: ./gradlew clean

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run data generation
      run: ./gradlew runData

    - name: Check for uncommitted generated files
      run: |
        if [ -n "$(git status --porcelain src/generated)" ]; then
          echo "::error::Generated files are not up to date. Please run './gradlew runData' and commit the changes."
          git status --porcelain src/generated
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: HKB-Mod-${{ matrix.java }}-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 30

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ matrix.java }}-${{ github.sha }}
        path: |
          build/reports/
          logs/
        retention-days: 7