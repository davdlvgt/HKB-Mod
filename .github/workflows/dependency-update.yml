name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: dev

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-8.12.1-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify and force Gradle wrapper version
      run: |
        echo "Gradle wrapper version:"
        grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
        echo "Forcing Gradle wrapper to download correct version..."
        ./gradlew wrapper --gradle-version=8.12.1
        echo "Verifying Gradle version:"
        ./gradlew --version

    - name: Check for Gradle updates
      run: |
        echo "Current Gradle version (should be 8.12.1 for Forge compatibility):"
        ./gradlew --version
        echo "Skipping Gradle update - Forge requires Gradle 8.12.1"

    - name: Check current versions
      id: current_versions
      run: |
        FORGE_VERSION=$(grep 'forge_version=' gradle.properties | cut -d'=' -f2)
        MC_VERSION=$(grep 'minecraft_version=' gradle.properties | cut -d'=' -f2)
        MAPPING_VERSION=$(grep 'mapping_version=' gradle.properties | cut -d'=' -f2)

        echo "forge=$FORGE_VERSION" >> $GITHUB_OUTPUT
        echo "minecraft=$MC_VERSION" >> $GITHUB_OUTPUT
        echo "mapping=$MAPPING_VERSION" >> $GITHUB_OUTPUT

    - name: Check for Forge updates
      id: forge_check
      run: |
        # This is a simplified check - you might want to use a more sophisticated method
        # to check for the latest Forge version for your Minecraft version
        echo "forge_available=check_manually" >> $GITHUB_OUTPUT

    - name: Create dependency update issue
      if: steps.forge_check.outputs.forge_available != 'none'
      uses: actions/github-script@v7
      with:
        script: |
          const currentVersions = {
            forge: '${{ steps.current_versions.outputs.forge }}',
            minecraft: '${{ steps.current_versions.outputs.minecraft }}',
            mapping: '${{ steps.current_versions.outputs.mapping }}'
          };

          const issueBody = `## 🔄 Dependency Update Check

          This is an automated check for dependency updates.

          ### Current Versions
          - **Forge**: ${currentVersions.forge}
          - **Minecraft**: ${currentVersions.minecraft}
          - **Mappings**: ${currentVersions.mapping}

          ### Action Required
          Please manually check for updates to:

          1. **MinecraftForge**: Check [MinecraftForge website](https://files.minecraftforge.net/net/minecraftforge/forge/) for latest version compatible with Minecraft ${currentVersions.minecraft}
          2. **Parchment Mappings**: Check [ParchmentMC versions](https://parchmentmc.org/docs/getting-started) for latest mappings
          3. **Gradle**: Check if Gradle wrapper was updated by this action

          ### Update Process
          If updates are available:
          1. Create a branch: \`update/dependencies-$(date +%Y-%m-%d)\`
          2. Update \`gradle.properties\` with new versions
          3. Test thoroughly with \`./gradlew build\` and \`./gradlew runClient\`
          4. Update \`CLAUDE.md\` if version requirements change
          5. Create PR to \`dev\` branch

          ### Testing Checklist
          - [ ] Mod builds successfully
          - [ ] Data generation works (\`./gradlew runData\`)
          - [ ] Client launches without errors
          - [ ] All existing features work as expected
          - [ ] No new console errors or warnings

          ---
          *This issue was automatically created by the dependency update workflow.*
          `;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🔄 Dependency Update Check - ${new Date().toISOString().split('T')[0]}`,
            body: issueBody,
            labels: ['dependencies', 'maintenance', 'automated']
          });

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-8.12.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Run security audit
      run: |
        chmod +x gradlew
        echo "Gradle wrapper version:"
        grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties
        echo "Forcing Gradle wrapper to download correct version..."
        ./gradlew wrapper --gradle-version=8.12.1
        echo "Verifying Gradle version:"
        ./gradlew --version
        # Check for known vulnerabilities in dependencies
        ./gradlew dependencies --configuration runtimeClasspath > dependencies.txt

        # Look for any known problematic versions (this is a basic check)
        if grep -i "vulnerable\|security\|cve" dependencies.txt; then
          echo "::warning::Potential security issues found in dependencies"
        fi

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-report
        path: dependencies.txt
        retention-days: 30